name: Deploiement staging

on:
  workflow_run:
    workflows: ["Construction et publication"]
    types: [completed]
    branches: [dev]

env:
  IMAGE_API:      ${{ secrets.ACR_NAME }}.azurecr.io/todo-infra-api
  IMAGE_FRONTEND: ${{ secrets.ACR_NAME }}.azurecr.io/todo-infra-frontend

jobs:
  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: SHA de la revision courante
        id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploiement API staging
        run: |
          az containerapp update \
            --name           todo-infra-api-staging \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image          ${{ env.IMAGE_API }}:${{ steps.meta.outputs.sha }} \
            --set-env-vars   PORT=4000 NODE_ENV=staging \
            --set-env-vars   DATABASE_URL=secretref:postgres-staging-url \
            --set-env-vars   REDIS_URL=secretref:redis-staging-url \
            --set-env-vars   CORS_ORIGIN=secretref:cors-staging

      - name: Deploiement frontend staging
        run: |
          az containerapp update \
            --name           todo-infra-frontend-staging \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image          ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.sha }} \
            --set-env-vars   API_URL=secretref:api-staging-internal-url

      - name: Test de sante staging
        run: |
          FQDN=$(az containerapp show \
            --name           todo-infra-api-staging \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query          "properties.configuration.ingress.fqdn" -o tsv)
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/health")
            [[ "$STATUS" == "200" ]] && echo "Staging operationnel" && exit 0
            echo "Tentative $i — statut $STATUS"
            sleep 6
          done
          echo "Echec du test de sante staging" && exit 1
